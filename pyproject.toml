[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codelines"
version = "0.2.0"
description = "A parallel physical line counter with table, JSON and CSV reports"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Muneer Alam", email = "muneer.alam320@gmail.com" }
]
keywords = ["loc", "lines-of-code", "code-metrics", "cli", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]
requires-python = ">=3.9"
dependencies = [
    "rich>=13.0.0",
    "pathspec>=1.0.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/muneer320/codelines"
Repository = "https://github.com/muneer320/codelines"
Issues = "https://github.com/muneer320/codelines/issues"

[project.scripts]
codelines = "codelines.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codelines"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
